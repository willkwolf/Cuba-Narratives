name: Continuous Fact-Checking & Integrity Audit

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    # Ejecución mensual de auditoría periódica de fuentes
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  audit-data-and-claims:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar auditoría de datos, fuentes y claims
        run: |
          python scripts/audit_claims.py

      - name: Validar esquema de JSON
        run: |
          python -c "import json; json.load(open('data/indicadores.json')); json.load(open('data/bitacora.json')); print('JSONs sintácticamente impecables')"
